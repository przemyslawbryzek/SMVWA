rules:
  # CWE-89: SQL Injection — template literal with req.body interpolation
  - id: sqli-req-body
    pattern: $SQL = `...${ $REQ.body.$F }...`
    message: >
      SQL Injection (CWE-89): req.body field interpolated directly into SQL string.
      Use parameterized queries with $1/$2 placeholders.
    languages: [javascript]
    severity: ERROR
    metadata:
      cwe: CWE-89
      owasp: "A03:2021 - Injection"
      category: security

